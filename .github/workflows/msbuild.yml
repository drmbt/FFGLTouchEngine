# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  push:
    tags:
      - '*'
  # Manual builds. Leave `version` empty to just produce artifacts; set it to a
  # tag name to also publish the release. Tag pushes do not reliably trigger
  # workflows on this fork (v3.0.0 and v3.0.1 both pushed without starting a
  # run), so dispatch is the supported path to a release here.
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to build and publish (e.g. v3.0.1). Empty = artifacts only, no release.'
        required: false
        default: ''

env:
  BUILD_CONFIGURATION: Release
  # Tag name on a tag push; the dispatch input when publishing manually;
  # otherwise the branch name, which is fine for artifact-only builds.
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -B build -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: Generate Zip
      run: |
        New-Item -ItemType Directory -Force -Path staging
        Copy-Item "build\src\plugins\FFGLTouchEngine\Release\FFGLTouchEngine.dll" staging\
        Copy-Item "build\src\plugins\FFGLTouchEngineFX\Release\FFGLTouchEngineFX.dll" staging\
        Copy-Item "lib\TouchEngine\TouchEngine.dll" staging\
        "Copy ALL THREE DLLs (FFGLTouchEngine.dll, FFGLTouchEngineFX.dll, TouchEngine.dll) into your Resolume plugins folder, e.g. Documents\Resolume Arena\Extra Effects." | Out-File staging\README.txt
        "TouchEngine.dll here is the redistributable client library and is required. Do NOT substitute the one from TouchDesigner\bin - that is an internal component and every load fails with TEResultBadUsage." | Out-File staging\README.txt -Append
        "Do not place backup copies in subfolders of the plugin dir: Resolume scans recursively and duplicate FFGL IDs break loading." | Out-File staging\README.txt -Append
        "${{ env.VERSION }}" | Out-File staging\VERSION.txt
        Compress-Archive -Path staging\* -Destination "FFGLTouchEngine-Windows-${{ env.VERSION }}.zip"

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: "FFGLTouchEngine-Windows-${{ env.VERSION }}.zip"

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Generate Xcode Project
      run: |
        mkdir -p build-mac
        cd build-mac
        cmake -G Xcode -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 ..

    - name: Build
      run: |
        xcodebuild -project build-mac/FFGLTouchEngine.xcodeproj \
          -scheme ALL_BUILD \
          -configuration Release

    - name: Generate Zip
      run: |
        cd build-mac/Release
        zip -r "../../FFGLTouchEngine-macOS-${{ env.VERSION }}.zip" \
          FFGLTouchEngine.bundle \
          FFGLTouchEngineFX.bundle

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: "FFGLTouchEngine-macOS-${{ env.VERSION }}.zip"

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Publish on a tag push, or on a dispatch that named a version. A dispatch
    # with no version still produces both artifacts but must never create a
    # release named after a branch.
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.version != ''

    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-build

    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-build

    - name: Generate Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "FFGLTouchEngine-Windows-${{ env.VERSION }}.zip,FFGLTouchEngine-macOS-${{ env.VERSION }}.zip"
        # Explicit: on a dispatch github.ref is a branch, so the action cannot
        # infer the tag. The tag must already exist and point at this commit.
        tag: ${{ env.VERSION }}
        generateReleaseNotes: true
        # Fork builds stay prereleases until the artifact itself has been
        # verified on both platforms — not just the source it was built from.
        # Flip to false deliberately, per release.
        prerelease: true
