# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build

on:
  push:
    tags:
      - '*'
  # Manual builds for testing, without minting a tag or publishing a release.
  # The artifacts land on the run page and via `gh run download`.
  workflow_dispatch:

env:
  BUILD_CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3

    - name: Configure CMake
      run: cmake -B build -A x64

    - name: Build
      run: cmake --build build --config Release

    - name: Generate Zip
      run: |
        New-Item -ItemType Directory -Force -Path staging
        Copy-Item "build\src\plugins\FFGLTouchEngine\Release\FFGLTouchEngine.dll" staging\
        Copy-Item "build\src\plugins\FFGLTouchEngineFX\Release\FFGLTouchEngineFX.dll" staging\
        Copy-Item "lib\TouchEngine\TouchEngine.dll" staging\
        "Copy FFGLTouchEngine.dll and FFGLTouchEngineFX.dll to your Resolume plugins folder" | Out-File staging\README.txt
        "${{ github.ref_name }}" | Out-File staging\VERSION.txt
        Compress-Archive -Path staging\* -Destination "FFGLTouchEngine-Windows-${{ github.ref_name }}.zip"

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-build
        path: "FFGLTouchEngine-Windows-${{ github.ref_name }}.zip"

  build-macos:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3

    - name: Generate Xcode Project
      run: |
        mkdir -p build-mac
        cd build-mac
        cmake -G Xcode -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 ..

    - name: Build
      run: |
        xcodebuild -project build-mac/FFGLTouchEngine.xcodeproj \
          -scheme ALL_BUILD \
          -configuration Release

    - name: Generate Zip
      run: |
        cd build-mac/Release
        zip -r "../../FFGLTouchEngine-macOS-${{ github.ref_name }}.zip" \
          FFGLTouchEngine.bundle \
          FFGLTouchEngineFX.bundle

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-build
        path: "FFGLTouchEngine-macOS-${{ github.ref_name }}.zip"

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    # Only tag pushes publish. A workflow_dispatch run still produces both
    # artifacts to download, but must never create a release named after a
    # branch (github.ref_name is the branch, not a version, when dispatched).
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - name: Download Windows Artifact
      uses: actions/download-artifact@v4
      with:
        name: windows-build

    - name: Download macOS Artifact
      uses: actions/download-artifact@v4
      with:
        name: macos-build

    - name: Generate Release
      uses: ncipollo/release-action@v1
      with:
        artifacts: "FFGLTouchEngine-Windows-${{ github.ref_name }}.zip,FFGLTouchEngine-macOS-${{ github.ref_name }}.zip"
        generateReleaseNotes: true
        # Fork builds stay prereleases until the artifact itself has been
        # verified on both platforms — not just the source it was built from.
        # Flip to false deliberately, per release.
        prerelease: true
